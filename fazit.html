<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profit Leak Ergebnis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --gold:#d4af37;
      --gold-2:#f7e7a5;
      --gold-3:#8f6f1d;
      --black:#000;
      --panel:#0b0b0b;
      --line:rgba(212,175,55,.22);
      --line-2:rgba(212,175,55,.10);
      --text:#f6f1e8;
      --muted:#b8b0a3;
      --shadow:0 24px 60px rgba(0,0,0,.55);
      --radius:28px;
      --titleFont:'Cinzel',serif;
      --bodyFont:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--bodyFont);background:linear-gradient(180deg,#000 0%,#050505 100%);color:var(--text);padding:22px}
    .wrap{max-width:980px;margin:0 auto 40px}
    .hero,.panel,.f1-gauge-wrap,.box,.result,.cta{position:relative;overflow:hidden;background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0) 18%), rgba(8,8,8,.78);border:1px solid var(--line);box-shadow:var(--shadow)}
    .hero{border-radius:34px;padding:28px 24px;margin-bottom:18px;backdrop-filter: blur(16px)}
    .hero-inner,.cta-inner{position:relative;z-index:1}
    h1{margin:0 0 8px;font-family:var(--titleFont);font-weight:700;font-size:clamp(30px,4vw,44px);letter-spacing:.10em;text-transform:uppercase;color:var(--gold-2)}
    .sub{margin:0;max-width:760px;font-size:16px;line-height:1.7;color:var(--muted)}
    .panel{border-radius:var(--radius);padding:20px 18px;margin-bottom:18px;backdrop-filter: blur(14px)}
    .section-title{margin:4px 0 6px;font-family:var(--titleFont);font-size:24px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-2)}
    .section-sub{margin:0 0 12px;font-size:13px;color:var(--muted)}
    .kpi{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .box{border-radius:20px;padding:16px 12px;text-align:center;background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0) 22%), rgba(17,17,17,.85);backdrop-filter: blur(10px);border:1px solid var(--line-2);transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease}
    .box .muted{color:rgba(246,241,232,.7);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--titleFont)}
    .box .big{margin-top:7px;font-family:var(--titleFont);font-size:22px;letter-spacing:.04em;color:var(--gold)}
    .result{border-radius:24px;padding:16px 16px 12px;background:linear-gradient(180deg,#121212,#070707);border:1px solid var(--line-2);margin-bottom:14px;min-height:120px}
    .result h3{margin:0 0 8px;font-family:var(--titleFont);font-size:18px;letter-spacing:.06em;color:var(--gold-2)}
    .result p{margin:5px 0;line-height:1.65;color:var(--text)}
    .result p strong{font-family:var(--titleFont);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted)}
    .leak-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:8px}
    .f1-gauge-wrap{border-radius:22px;padding:14px 14px 10px;background:linear-gradient(180deg,#121212,#090909);border:1px solid var(--line-2)}
    .f1-gauge-label{margin-bottom:8px;font-family:var(--titleFont);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .f1-gauge{width:100%;display:block}
    .legend{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}
    .legend span{display:inline-flex;align-items:center;gap:5px}
    .legend-dot{width:10px;height:10px;border-radius:999px;display:inline-block;background:linear-gradient(135deg,var(--gold),var(--gold-2));box-shadow:0 0 14px rgba(212,175,55,.35)}
    .cta{margin-top:14px;border-radius:28px;padding:18px 16px 16px;background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 20%), rgba(7,7,7,.82);backdrop-filter: blur(14px);border:1px solid rgba(212,175,55,.28)}
    .cta-title{font-family:var(--titleFont);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2)}
    .cta-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
    .cta-status{padding:5px 11px;border-radius:999px;font-size:11px;font-family:var(--titleFont);letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(212,175,55,.4);background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#111;box-shadow:0 8px 18px rgba(212,175,55,.14)}
    .cta-body{font-size:13px;line-height:1.7;color:rgba(246,241,232,.92);margin-bottom:10px}
    .cta-list{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.55;color:rgba(246,241,232,.92)}
    .cta-list li{margin-top:4px}
    .cta-btn{margin-top:12px;background:linear-gradient(135deg,var(--gold-3),var(--gold),var(--gold-2));color:#090909;padding:12px 18px;border-radius:999px;font-size:13px;text-transform:uppercase;letter-spacing:.14em;font-family:var(--titleFont);font-weight:700;border:none;cursor:pointer;box-shadow:0 14px 28px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.18)}
    .small-note{margin-top:8px;font-size:11px;color:rgba(246,241,232,.68)}
    .error-message{padding:10px 12px;border-radius:14px;border:1px solid rgba(184,87,87,.4);background:rgba(184,87,87,.10);color:#ffcbcb;font-size:13px;margin-top:10px}
    @media (min-width:720px){.leak-grid{grid-template-columns:repeat(2,1fr)}.leak-grid div:last-child{grid-column:1/-1}}
    @media (max-width:520px){body{padding:14px}.hero{padding:22px 18px}.panel{padding:16px 14px}.kpi{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="hero-inner">
        <h1>Profit Leak Ergebnis</h1>
        <p class="sub" id="heroSub">Auf Basis Ihres Quick Checks erhalten Sie hier Ihr klares Profit Leak Ranking, die Benchmark-Einschätzung und eine konkrete Empfehlung für den nächsten Schritt.</p>
      </div>
    </div>

    <div class="panel" id="contentPanel"></div>
  </div>

  <script>
    function getPayloadFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('data');
      if (!raw) return null;
      try { return JSON.parse(decodeURIComponent(raw)); } catch (e) { console.error('Fehler beim Lesen von data', e); return null; }
    }
    
function normLeak(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return 0;
  if (n <= 1) return Math.max(0, Math.min(1, n));
  if (n <= 4) return Math.max(0, Math.min(1, n / 4));
  return Math.max(0, Math.min(1, n / 100));
}

function renderF1Gauge(containerId, value0to1) {
  const pct = Math.max(0, Math.min(1, Number(value0to1) || 0));
  const angle = -90 + pct * 180;
  const fillPct = Math.round(pct * 1000) / 10;
  const svg = `
    <svg viewBox="0 0 200 120" class="f1-gauge" aria-hidden="true">
      <defs>
        <linearGradient id="grad-${containerId}" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#7a5a12" />
          <stop offset="45%" stop-color="#d4af37" />
          <stop offset="100%" stop-color="#fff1b8" />
        </linearGradient>
      </defs>
      <path d="M10,110 A90,90 0 0 1 190,110" fill="none" stroke="rgba(212,175,55,0.18)" stroke-width="16" stroke-linecap="round"/>
      <path d="M10,110 A90,90 0 0 1 190,110" fill="none" stroke="url(#grad-${containerId})" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - (pct * 100)}"/>
      <line x1="100" y1="110" x2="100" y2="28" stroke="#d4af37" stroke-width="4" stroke-linecap="round" transform="rotate(${angle} 100 110)"/>
      <circle cx="100" cy="110" r="6" fill="#d4af37"/>
      <circle cx="100" cy="110" r="2.2" fill="#fff1bf"/>
      <text x="100" y="81" text-anchor="middle" fill="#f6f1e8" font-family="Inter,system-ui" font-size="13" font-weight="600">${fillPct}%</text>
    </svg>`;
  const el = document.getElementById(containerId);
  if (el) el.innerHTML = svg;
}
function init() {
      const payload = getPayloadFromQuery();
      const panel = document.getElementById('contentPanel');
      if (!payload) { panel.innerHTML = '<div class="error-message">Kein Ergebnis gefunden. Bitte führen Sie den Quick Check erneut durch.</div>'; return; }
      const leaks = payload.leaks || {};
      const leaksNorm = { pricing: normLeak(leaks.pricing), cost: normLeak(leaks.cost), working: normLeak(leaks.workingCapital), process: normLeak(leaks.process), positioning: normLeak(leaks.positioning) };
      const company = payload.companyName || 'Ihr Unternehmen';
      const benchText = payload.benchmark || '';
      const benchLabel = benchText ? benchText.split('.')[0] : 'Benchmark';
      const topLeak = payload.topLeak || 'nicht definiert';
      document.getElementById('heroSub').textContent = `Ergebnis für ${company}: Quick Check Profit Leak Analyse.`;
      panel.innerHTML = `
        <h2 class="section-title">Kurzüberblick</h2>
        <p class="section-sub">Vorläufige Einordnung Ihres Unternehmens sowie der stärkste Gewinnhebel.</p>
        <div class="kpi">
          <div class="box"><div class="muted">Benchmark</div><div class="big" id="benchmarkLabel">${benchLabel}</div></div>
          <div class="box"><div class="muted">Top Leak</div><div class="big" id="topLeakLabel">${topLeak}</div></div>
        </div>
        <div class="result" id="resultBox">
          <h3>${company}</h3>
          <p><strong>Vorläufiges Profit Leak Ranking</strong><br>${topLeak ? `Der stärkste Hebel in Ihrem Quick Check ist aktuell der Bereich <strong>${topLeak}</strong>.` : 'Ihr Quick Check zeigt mehrere mögliche Gewinnhebel.'}</p>
          ${benchText ? `<p><strong>Ihre Benchmark-Einschätzung</strong><br>${benchText}</p>` : ''}
        </div>
        <h2 class="section-title">F1Tachometer Ihrer 5 Profit Leaks</h2>
        <p class="section-sub">Die SVG-Tachometer zeigen auf einen Blick, wo aktuell das größte Potenzial bzw. der stärkste Druck liegt. Gold markiert die jeweilige Ausprägung.</p>
        <div class="leak-grid">
          <div class="f1-gauge-wrap"><div class="f1-gauge-label">Pricing Lever</div><div id="gauge-pricing"></div></div>
          <div class="f1-gauge-wrap"><div class="f1-gauge-label">Cost Lever</div><div id="gauge-cost"></div></div>
          <div class="f1-gauge-wrap"><div class="f1-gauge-label">Working Capital Drag</div><div id="gauge-working"></div></div>
          <div class="f1-gauge-wrap"><div class="f1-gauge-label">Prozessverlust</div><div id="gauge-process"></div></div>
          <div class="f1-gauge-wrap"><div class="f1-gauge-label">Strategische Positionierung</div><div id="gauge-positioning"></div></div>
        </div>
        <div class="legend"><span><span class="legend-dot"></span> stabil</span><span><span class="legend-dot"></span> im Blick behalten</span><span><span class="legend-dot"></span> Handlungsbedarf</span></div>
        <div class="cta" id="ctaBox">
          <div class="cta-inner">
            <div class="cta-header"><div class="cta-title">Profit Leak Check PRO</div><div class="cta-status" id="ctaStatus">Aktiv nach Quick Check</div></div>
            <div class="cta-body" id="ctaBody">Empfohlener nächster Schritt. Auf Basis Ihres Quick Checks erhalten Sie eine erste Einschätzung Ihrer stärksten Gewinnhebel und können anschließend den Profit Leak Check PRO anfragen.</div>
            <ul class="cta-list">
              <li>Die Pro-Version gibt eine tiefere Analyse und klare Einschätzung, wo Gewinnpotenziale liegen.</li>
              <li>Benchmark Ranking: Sie erfahren, wie profitabel Ihr Unternehmen im Vergleich zu Mitbewerbern ist.</li>
              <li>Profit Leak Ranking: Ihre stärksten Hebel für mehr Gewinn, Liquidität und unternehmerische Entlastung.</li>
              <li>Erste Benchmark-Einschätzung im 60-minütigen 1:1-Gespräch mit einem Experten.</li>
              <li>Kein Berater-Blabla, sondern umsetzbare Handlungsempfehlungen.</li>
            </ul>
            <button class="cta-btn" id="ctaButton">Analyse anfragen</button>
            <div class="small-note" id="ctaNote">CTA ist aktiv, weil der Quick Check abgeschlossen wurde. Die endgültige Einschätzung erfolgt im persönlichen Gespräch.</div>
          </div>
        </div>`;
      renderF1Gauge('gauge-pricing', leaksNorm.pricing);
      renderF1Gauge('gauge-cost', leaksNorm.cost);
      renderF1Gauge('gauge-working', leaksNorm.working);
      renderF1Gauge('gauge-process', leaksNorm.process);
      renderF1Gauge('gauge-positioning', leaksNorm.positioning);
      const ctaButton = document.getElementById('ctaButton');
      if (ctaButton) ctaButton.addEventListener('click', function(){
        const subject = encodeURIComponent(`Profit Leak Check PRO Anfrage von ${company}`);
        const bodyLines = ['Guten Tag,','','ich möchte auf Basis des Profit Leak Quick Checks den Profit Leak Check PRO anfragen.','',`Unternehmen: ${company}`,`Benchmark: ${benchLabel}`,`Top Leak: ${topLeak}`,'','Bitte melden Sie sich für die Terminvereinbarung.','','Beste Grüße'];
        const body = encodeURIComponent(bodyLines.join('\n'));
        const to = 'office@dein-unternehmen.de';
        window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
      });
    }
    init();
  </script>
</body>
</html>
